name: CD — Deploy Full Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/expense-tracker || git clone https://github.com/ManiBonagiri/expense-tracker.git /home/ubuntu/expense-tracker
            cd /home/ubuntu/expense-tracker
            git pull origin main
            docker compose down
            docker compose up -d --build